# Purpose: Python package metadata and tool configuration for the single slokern package.
# Owner: Rajdeep

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slokern"
version = "0.1.0"
description = "Optimize inference. Verify performance. SLO-aware LLM serving optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rajdeep Paul" },
]
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: marks tests requiring live hardware or provider endpoints (deselect with '-m \"not live\"')",
]
